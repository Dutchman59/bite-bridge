<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sigup</title>
  <link rel="stylesheet" href="../css/signup.css">
</head>

<body>
  <nav class="navbar">
    <div class="logo">

      <img src="../icons_images/logo.png" alt="Bite-Bridge Logo">
    </div>
  </nav>
  <div class="container">
    <h2>Create Account</h2>
    <p class="subtitle">Sign up to start using BiteBridge</p>
    <input required placeholder="Enter firstname..." type="text" id="firstname-input">
    <input required type="text" placeholder="Enter surname..." id="surname-input">
    <input required type="email" placeholder="Enter email..." id="email-input">
    <input required type="password" placeholder="Enter password..." id="password-input">
    <button type="submit" id="sign-up-button">
      sign up
    </button>
    <b>Have an account ? <a href="login.html">login</a></b>
    <a href="index.html">Go back home</a>
  </div>
  <script type="module" src="../javascript/index.js"></script>

</body>

</html>
