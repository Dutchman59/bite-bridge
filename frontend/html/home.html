<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bite-bridge dashboard</title>
  <link rel="stylesheet" href="../css/signup.css">
</head>

<body>
  <nav class="navbar">
    <div class="logo">
      <a href="index.html">
        <img src="../icons_images/logo.png" alt="logo">
      </a>
    </div>

    <ul class="nav-links">
      <li><a href="index.html">Home
        <img src="../icons_images/home.png" alt="">
      </a></li>
      <li><a href="menu.html">Restaurants</a></li>
      <li><a href="#">Orders</a></li>
    </ul>
  </nav>
  <div class="welcome-container">
   </div>
  <section class="home-hero">

    <div class="hero-text">
      <h1>Discover Amazing <span>Meals</span></h1>
      <p>Browse restaurants and order delicious food from your favorite places.</p>

      <div class="search-box">
        <input type="text" placeholder="Search meals or restaurants...">
        <button>Search</button>
      </div>

    </div>

  </section>
  <h3 class="section-title">Quick Actions</h3>

  <div class="cards">


    <a href="menu.html" style="text-decoration: none;">
      <button>
        <img src="../icons_images/a6.jpg" alt="">
        <b>🍔 Browse Restaurants and food</b>
      </button>
    </a>

    <button>
      <img src="../icons_images/a5.jpg" alt="">
      <b>
        📦 My Orders <br>
        See your recent orders</b>
    </button>
    <button>
      <img src="../icons_images/a4.jpg" alt="">
      <b>🛒 My Cart <br> See your food in cart</b>
    </button>
    <button>
      <img src="../icons_images/a3.jpg" alt="">
      <b>👤 Profile <br> Edit profile or update </b>
    </button>
  </div>

  <h3 class="section-title">Recent Orders</h3>

  <div class="orders">
    Order #1023 - Delivered <br>
    Order #1024 - Preparing
  </div>
  <button class="logout">Logout</button>
  <script type="module" src="../javascript/index.js"></script>
</body>

</html>
