<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bite-Bridge Owner</title>
  <link rel="stylesheet" href="owner.css">
</head>
<style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial;
}

body {
  background: #111;
  color: white;
}

.navbar {
  display: flex;
  justify-content: space-between;
  padding: 15px 20px;
  background: #000;
  position: sticky;
  top: 0;
}

.navbar button {
  background: orange;
  border: none;
  padding: 8px 15px;
  cursor: pointer;
  border-radius: 5px;
}

.container {
  padding: 20px;
}

.stats {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.card {
  background: #222;
  padding: 20px;
  flex: 1;
  text-align: center;
  border-radius: 10px;
}

.add-food {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: #222;
  padding: 15px;
  border-radius: 10px;
}

.add-food input,
.add-food textarea {
  padding: 10px;
  border: none;
  border-radius: 5px;
}

.add-food button {
  background: orange;
  border: none;
  padding: 10px;
  cursor: pointer;
}

.menu-list {
  margin-top: 20px;
}

.menu-card {
  display: flex;
  gap: 10px;
  background: #222;
  padding: 10px;
  margin-top: 10px;
  border-radius: 10px;
  align-items: center;
}

.menu-card img {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: 10px;
}

.menu-info {
  flex: 1;
}

.menu-card button {
  background: red;
  border: none;
  padding: 5px 10px;
  cursor: pointer;
}

.orders {
  margin-top: 20px;
  background: #222;
  padding: 15px;
  border-radius: 10px;
}

@media(max-width: 768px) {
  .menu-card {
    flex-direction: column;
    align-items: flex-start;
  }

  .menu-card img {
    width: 100%;
    height: 150px;
  }
}
</style>
<body>

<nav class="navbar">
  <h2>Bite-Bridge Owner</h2>
  <button id="logout">Logout</button>
</nav>

<div class="container">

  <div class="stats">
    <div class="card">Orders: <span id="ordersCount">0</span></div>
    <div class="card">Revenue: Ksh <span id="revenue">0</span></div>
    <div class="card">Menu Items: <span id="menuCount">0</span></div>
  </div>

  <div class="add-food">
    <h3>Add New Food</h3>
    <input type="text" id="name" placeholder="Food Name">
    <input type="number" id="price" placeholder="Price">
    <input type="text" id="img" placeholder="Image path">
    <textarea id="desc" placeholder="Description"></textarea>
    <button id="addFood">Add Food</button>
  </div>

  <div class="menu-list">
    <h3>Your Menu</h3>
    <div id="menuItems"></div>
  </div>

  <div class="orders">
    <h3>Orders</h3>
    <div id="ordersList"></div>
  </div>

</div>

<script>
const menuContainer = document.getElementById("menuItems");

function getFoods() {
  return JSON.parse(localStorage.getItem("foods")) || [];
}

function saveFoods(data) {
  localStorage.setItem("foods", JSON.stringify(data));
}

function renderMenu() {
  const foods = getFoods();
  menuContainer.innerHTML = "";

  foods.forEach((food, index) => {
    menuContainer.innerHTML += `
      <div class="menu-card">
        <img src="${food.img}">
        <div class="menu-info">
          <h4>${food.name}</h4>
          <p>${food.desc}</p>
          <span>Ksh ${food.price}</span>
        </div>
        <button onclick="deleteFood(${index})">Delete</button>
      </div>
    `;
  });

  document.getElementById("menuCount").textContent = foods.length;
}

function deleteFood(index) {
  const foods = getFoods();
  foods.splice(index, 1);
  saveFoods(foods);
  renderMenu();
}

document.getElementById("addFood").addEventListener("click", () => {
  const name = document.getElementById("name").value;
  const price = document.getElementById("price").value;
  const img = document.getElementById("img").value;
  const desc = document.getElementById("desc").value;

  if (!name || !price) return;

  const foods = getFoods();

  foods.push({ name, price, img, desc });

  saveFoods(foods);
  renderMenu();
});


document.getElementById("logout").addEventListener("click", () => {
  localStorage.removeItem("user");
  window.location.href = "signup.html";
});

renderMenu();
</script>

</body>
</html>
