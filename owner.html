<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #a01930, #530c2a);
        font-family: 'Segoe UI', sans-serif;
    }

    .card {
        background: white;
        width: 320px;
        padding: 20px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        transition: transform 0.5s ease;
    }

    .card:hover {
        transform: scale(1.05);
    }

    h1 {
        color: #ff4d6d;
        margin-bottom: 10px;
    }

    p {
        color: #333;
        font-size: 16px;
    }

    .hidden-message {
        display: none;
        margin-top: 15px;
        color: #444;
        animation: fadeIn 1s ease forwards;
    }

    button {
        margin-top: 15px;
        padding: 10px 20px;
        border: none;
        background: #ff4d6d;
        color: white;
        border-radius: 20px;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.3s;
    }
    .ka{
      font-weight: bold;
      color: red;
      opacity: 0.7;
      font-size: large;
      border-bottom: 1px solid grey;
      border-radius: 4px;
    }

    button:hover {
        background: #e63956;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
</style>
</head>

<body>

<div class="card">
    <h1>❤️ My Love  ❤️</h1>
    <hr>
    <p>You are the most beautiful part of my life.</p>

    <button onclick="showMessage()">Click Me 💖</button>

    <div class="hidden-message" id="message">
        <p>
            From the moment you came into my life, everything changed.  
            You bring me peace, joy, and a love I never knew existed.  
            I cherish you more than words can ever express.  
            ❤️ I love you always ❤️ 
            
        </p>
        <p class="ka" >my ka-little Wairimu</p>
    </div>
</div>

<script>
function showMessage() {
    document.getElementById("message").style.display = "block";
}
</script>

</body>
</html>
